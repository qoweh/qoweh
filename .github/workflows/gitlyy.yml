name: Update GitHub Activity card
on:
  schedule:
    - cron: "0 */6 * * *"   # 6시간마다
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch SVG
        # gitlyy가 응답하지 않으면 이번 회차만 건너뛰고 기존 카드를 유지
        run: |
          if ! curl -fsSL --retry 3 --max-time 30 \
            "https://gitlyy.vercel.app/api/contribution?username=qoweh&hide_border=true&theme=dark" \
            -o gitlyy.tmp.svg; then
            echo "::warning::gitlyy fetch failed, keeping the previous card"
            exit 0
          fi
          if grep -q "<svg" gitlyy.tmp.svg; then
            mv gitlyy.tmp.svg gitlyy.svg
          else
            echo "::warning::response is not an SVG, keeping the previous card"
          fi
          rm -f gitlyy.tmp.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitlyy.svg
          git diff --cached --quiet || git commit -m "chore: update gitlyy card"
          git pull --rebase
          git push
